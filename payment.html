<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment</title>

<link rel="stylesheet" href="style.css">

<style>
body{
font-family:Arial,sans-serif;
background:#f4f4f4;
}

.payment-box{
width:400px;
margin:50px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 5px 15px rgba(0,0,0,.2);
}

.payment-box h2{
text-align:center;
margin-bottom:20px;
}

.payment-box input,
.payment-box select{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:5px;
}

.payment-box button{
width:100%;
padding:12px;
background:#28a745;
color:white;
border:none;
font-size:18px;
cursor:pointer;
border-radius:5px;
}

.payment-box button:hover{
background:#218838;
}
</style>

</head>

<body>

<div class="payment-box">

<h2>Payment</h2>

<input type="text" id="name" placeholder="Card Holder Name">

<input type="text" id="card" placeholder="Card Number" maxlength="16">

<input type="text" id="expiry" placeholder="MM/YY">

<input type="password" id="cvv" placeholder="CVV" maxlength="3">

<select id="method">
<option>Credit Card</option>
<option>Debit Card</option>
<option>UPI</option>
<option>Cash on Delivery</option>
</select>

<button onclick="payNow()">Pay Now</button>

</div>

<script>

function payNow(){

let name=document.getElementById("name").value;
let card=document.getElementById("card").value;
let expiry=document.getElementById("expiry").value;
let cvv=document.getElementById("cvv").value;
let method=document.getElementById("method").value;

if(name==""||card==""||expiry==""||cvv==""){

alert("Please fill all fields");

return;

}

alert("✅ Payment Successful using "+method);

localStorage.removeItem("cartCount");

window.location.href="success.html";

}

</script>

</body>
</html>
